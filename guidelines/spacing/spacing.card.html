<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:#1a1a1a;font-family:'JetBrains Mono',monospace;color:#d4d4d4}
.wrap{padding:22px;display:flex;align-items:flex-end;gap:14px}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:#e5c07b}.lab{font-size:10px;color:#6b6b6b}</style></head>
<body><div class="wrap">
<div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="lab">4</div></div>
<div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="lab">8</div></div>
<div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="lab">12</div></div>
<div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="lab">16</div></div>
<div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="lab">24</div></div>
<div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="lab">32</div></div>
<div class="col"><div class="bar" style="width:56px;height:56px"></div><div class="lab">56</div></div>
<div style="margin-left:24px;border:1px solid #333;padding:14px 18px;font-size:11px;color:#d4d4d4">border-radius: 0</div>
</div></body></html>
