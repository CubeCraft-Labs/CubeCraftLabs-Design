<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Terminal green & red" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:#1a1a1a;font-family:'JetBrains Mono',monospace}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:18px}
.sw{border:1px solid #2a2a2a}.chip{height:56px;display:flex;align-items:center;padding-left:14px;font-size:12px;color:#1a1a1a;font-weight:700}
.meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.n{font-size:11px;font-weight:700;color:#d4d4d4}.h{font-size:10px;color:#6b6b6b}</style></head>
<body><div class="g">
<div class="sw"><div class="chip" style="background:var(--ccl-green)">$ ✓ build complete</div><div class="meta"><span class="n">Success</span><span class="h">#98c379</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-red)">$ ✗ error</div><div class="meta"><span class="n">Error</span><span class="h">#e06c75</span></div></div>
</div></body></html>
