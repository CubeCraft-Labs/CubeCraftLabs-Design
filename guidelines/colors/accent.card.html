<!-- @dsCard group="Colors" viewport="700x150" name="Accent & ground" subtitle="Gold on charcoal — the whole brand" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:#1a1a1a;font-family:'JetBrains Mono',monospace}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px}
.sw{border:1px solid #2a2a2a}
.chip{height:56px}
.meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.n{font-size:11px;font-weight:700;color:#d4d4d4}.h{font-size:10px;color:#6b6b6b}</style></head>
<body><div class="g">
<div class="sw"><div class="chip" style="background:var(--ccl-charcoal)"></div><div class="meta"><span class="n">Charcoal</span><span class="h">#1a1a1a · bg</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-charcoal-3)"></div><div class="meta"><span class="n">Code</span><span class="h">#262626 · surface</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-gold)"></div><div class="meta"><span class="n">Gold</span><span class="h">#e5c07b · accent</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-gold-dim)"></div><div class="meta"><span class="n">Gold dim</span><span class="h">#caa869 · hover</span></div></div>
</div></body></html>
