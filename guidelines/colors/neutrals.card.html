<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & lines" subtitle="Text and border grays" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:#1a1a1a;font-family:'JetBrains Mono',monospace}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px}
.sw{border:1px solid #2a2a2a}.chip{height:56px}
.meta{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.n{font-size:11px;font-weight:700;color:#d4d4d4}.h{font-size:10px;color:#6b6b6b}</style></head>
<body><div class="g">
<div class="sw"><div class="chip" style="background:var(--ccl-text)"></div><div class="meta"><span class="n">Text</span><span class="h">#d4d4d4</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-text-muted)"></div><div class="meta"><span class="n">Muted</span><span class="h">#6b6b6b</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-border)"></div><div class="meta"><span class="n">Border</span><span class="h">#2a2a2a</span></div></div>
<div class="sw"><div class="chip" style="background:var(--ccl-border-2)"></div><div class="meta"><span class="n">Grid</span><span class="h">#333333</span></div></div>
</div></body></html>
